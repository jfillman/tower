.cards{display:grid;grid-template-columns:1.15fr 1fr 1.05fr;gap:.75rem;margin-top:1.25rem}

.card .eyebrow{margin-bottom:.35rem}
.card p,.card li{font-size:.8rem;line-height:1.5;color:var(--ink)}
.card ul{padding-left:1rem}

.card .dot.accent{background:var(--accent)} .card .dot.link{background:var(--link)}
.foot{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.06em;color:var(--soft);border-top:1px solid var(--rule);margin-top:1.25rem;padding-top:.6rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.foot a{color:var(--link);text-decoration:none}
@media (max-width:900px){.cards{grid-template-columns:1fr}}
@media print{@page{size:landscape;margin:10mm}body{padding:0}.cards{margin-top:.75rem}}

<div class="frame">
<p class="eyebrow">Break-glass · 01 · Architecture</p>
<h1>How a break-glass session works</h1>
<p class="lede">One backend in the middle of everything: it checks who you are, grants itself just enough in one namespace, records every byte, and cleans up.</p>
<div class="fig">
<svg viewBox="0 80 1000 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="01-how-it-works-title 01-how-it-works-desc">
<title id="01-how-it-works-title">How a break-glass session works</title>
<desc id="01-how-it-works-desc">Your browser talks only to the Backstage backend over a WebSocket. Backstage calls the cluster API server as its own identity, creates a temporary grant in the app namespace that allows it to add a debug container to the pod, relays the recorded terminal, writes a session record and uploads the recording to MinIO.</desc>

troke-width="1"/><text x="320.0" y="414.0" fill="#1b1f24" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Session record</text><text x="320.0" y="430.0" fill="#5b6570" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">who · why · what happened</text><rect x="416" y="384" width="160" height="64" rx="6" fill="#f2efe9"/><rect x="416" y="384" width="160" height="64" rx="6" fill="rgba(27,31,36,0.05)" stroke="#5b6570" stroke-width="1"/><text x="496.0" y="414.0" fill="#1b1f24" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Recordings</text><text x="496.0" y="430.0" fill="#5b6570" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">MinIO · SHA-256 · 365 days</text><text x="40" y="548" fill="#5b6570" font-size="16" font-family="'Instrument Serif', serif" font-style="italic">The browser never holds a Kubernetes credential, and Backstage holds no debug rights at rest.</text><line x1="24" y1="576" x2="976" y2="576" stroke="rgba(27,31,36,0.12)" stroke-width="0.8"/><text x="24" y="596" fill="#5b6570" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="96" y="588" width="16" height="12" rx="3" fill="rgba(91,101,112,0.10)" stroke="#838b93" stroke-width="1"/><text x="120" y="597" fill="#5b6570" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">You</text><rect x="155" y="588" width="16" height="12" rx="3" fill="rgba(185,121,31,0.08)" stroke="#b9791f" stroke-width="1"/><text x="179" y="597" fill="#5b6570" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Backstage</text><rect x="244" y="588" width="16" height="12" rx="3" fill="rgba(27,31,36,0.05)" stroke="#5b6570" stroke-width="1"/><text x="268" y="597" fill="#
