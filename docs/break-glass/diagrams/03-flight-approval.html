<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Two people on Flight</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f2efe9;--paper-2:#e8e3da;--ink:#1b1f24;--muted:#5b6570;--soft:#838b93;--accent:#b9791f;--link:#2e7ba6;--rule:rgba(27,31,36,0.12);
--card:#fff;--font-sans:'Geist',system-ui,sans-serif;--font-serif:'Instrument Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace}
body{font-family:var(--font-sans);background:var(--paper);color:var(--ink);padding:2.5rem 2rem 2rem}
.frame{max-width:1120px;margin:0 auto}
.eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:.5rem}
.lede{color:var(--muted);font-size:.9rem;line-height:1.5;max-width:70ch;margin-bottom:1.25rem}
.fig{overflow-x:auto}
svg{width:100%;min-width:900px;display:block}
.cards{display:grid;grid-template-columns:1.15fr 1fr 1.05fr;gap:.75rem;margin-top:1.25rem}
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:1rem 1.1rem}
.card .eyebrow{margin-bottom:.35rem}
.card p,.card li{font-size:.8rem;line-height:1.5;color:var(--ink)}
.card ul{padding-left:1rem}
.card .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:.4rem;background:var(--muted)}
.card .dot.accent{background:var(--accent)} .card .dot.link{background:var(--link)}
.foot{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.06em;color:var(--soft);border-top:1px solid var(--rule);margin-top:1.25rem;padding-top:.6rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.foot a{color:var(--link);text-decoration:none}
@media (max-width:900px){.cards{grid-template-columns:1fr}}
@media print{@page{size:landscape;margin:10mm}body{padding:0}.cards{margin-top:.75rem}}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#131619;--paper-2:#1b1f24;--ink:#e8e4dc;--muted:#a1aab3;--soft:#7f8891;--accent:#e8a33d;--link:#6fb2d9;--rule:rgba(232,228,220,0.14);--card:#1a1e23}

:root:not([data-theme=light]) svg [stroke="#b9791f"]{stroke:#e8a33d}
:root:not([data-theme=light]) svg [stroke="rgba(27,31,36,0.12)"]{stroke:rgba(232,228,220,0.12)}
:root:not([data-theme=light]) svg [stroke="rgba(27,31,36,0.20)"]{stroke:rgba(232,228,220,0.2)}}
:root[data-theme=dark]{--paper:#131619;--paper-2:#1b1f24;--ink:#e8e4dc;--muted:#a1aab3;--soft:#7f8891;--accent:#e8a33d;--link:#6fb2d9;--rule:rgba(232,228,220,0.14);--card:#1a1e23}

:root[data-theme=dark] svg [fill="#f2efe9"]{fill:#131619}

:root[data-theme=dark] svg [fill="rgba(27,31,36,0.06)"]{fill:rgba(232,228,220,0.06)}
:root[data-theme=dark] svg [fill="rgba(91,101,112,0.10)"]{fill:rgba(161,170,179,0.1)}
:root[data-theme=dark] svg [stroke="#1b1f24"]{stroke:#e8e4dc}

:root[data-theme=dark] svg [stroke="#5b6570"]{stroke:#a1aab3}
:root[data-theme=dark] svg [stroke="#838b93"]{stroke:#7f8891}
:root[data-theme=dark] svg [stroke="#b9791f"]{stroke:#e8a33d}

:root[data-theme=dark] svg [stroke="rgba(27,31,36,0.20)"]{stroke:rgba(232,228,220,0.2)}
</style>
</head>

<div class="frame">
<p class="eyebrow">Break-glass · 03 · Sequence</p>
<h1>Two people on Flight</h1>
<p class="lede">The approval changes nothing in the cluster. The grant appears only when the requester presses Start.</p>
