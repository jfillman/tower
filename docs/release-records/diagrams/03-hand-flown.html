<title>A Hand-flown release</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f2efe9;--paper-2:#e8e3da;--ink:#1b1f24;--muted:#5b6570;--soft:#838b93;--accent:#b9791f;--link:#2e7ba6;--rule:rgba(27,31,36,0.12);
--card:#fff;--font-sans:'Geist',system-ui,sans-serif;--font-serif:'Instrument Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace}
body{font-family:var(--font-sans);background:var(--paper);color:var(--ink);padding:2.5rem 2rem 2rem}
.frame{max-width:1120px;margin:0 auto}
.eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:.5rem}
.lede{color:var(--muted);font-size:.9rem;line-height:1.5;max-width:70ch;margin-bottom:1.25rem}
.fig{overflow-x:auto}
svg{width:100%;min-width:900px;display:block}
.cards{display:grid;grid-template-columns:1.15fr 1fr 1.05fr;gap:.75rem;margin-top:1.25rem}
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:1rem 1.1rem}
.card .eyebrow{margin-bottom:.35rem}
.card p,.card li{font-size:.8rem;line-height:1.5;color:var(--ink)}
.card ul{padding-left:1rem}
.card .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:.4rem;background:var(--muted)}
.card .dot.accent{background:var(--accent)} .card .dot.link{background:var(--link)}
.foot{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.06em;color:var(--soft);border-top:1px solid var(--rule);margin-top:1.25rem;padding-top:.6rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.foot a{color:var(--link);text-decoration:none}
@media (max-width:900px){.cards{grid-template-columns:1fr}}
@media print{@page{size:landscape;margin:10mm}body{padding:0}.cards{margin-top:.75rem}}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#131619;--paper-2:#1b1f24;--ink:#e8e4dc;--muted:#a1aab3;--soft:#7f8891;--accent:#e8a33d;--link:#6fb2d9;--rule:rgba(232,228,220,0.14);--card:#1a1e23}

:root[data-theme=dark]{--paper:#131619;--paper-2:#1b1f24;--ink:#e8e4dc;--muted:#a1aab3;--soft:#7f8891;--accent:#e8a33d;--link:#6fb2d9;--rule:rgba(232,228,220,0.14);--card:#1a1e23}

</head>

<div class="frame">
<p class="eyebrow">Release records · 03 · Sequence</p>
<h1>A Hand-flown release</h1>
<p class="lede">Two people, one PR. The status says whether a sign-off counts; it cannot stop the merge.</p>
<div class="fig">
<svg viewBox="0 24 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="03-hand-flown-title 03-hand-flown-desc">
<title id="03-hand-flown-title">A Hand-flown release</title>
<desc id="03-hand-flown-desc">Glidepath opens the release PR to production. Every two minutes the Tower backend sets the sign-off status to pending and announces that the release is ready. A second GitHub account approves; the status turns to success. You merge; the backend announces the release. Within minutes it commits the release record, and once the outcome is final it opens the outcome PR.</desc>

ke-width="1.2" marker-end="url(#arrow)"/><rect x="566" y="294" width="88" height="12" rx="2" fill="#f2efe9"/><text x="610.0" y="303" fill="#838b93" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STATUS SUCCESS</text><path d="M100,356 L500,356" fill="none" stroke="#5b6570" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="377" y="338" width="36" height="12" rx="2" fill="#f2efe9"/><text x="395" y="347" fill="#838b93" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MERGE</text><path d="M720,400 L100,400" fill="none" stroke="#5b6570" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/><rect x="582" y="382" width="56" height="12" rx="2" fill="#f2efe9"/><text x="610" y="391" fill="#838b93" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RELEASED</text><path d="M720,444 L500,444" fill="none" stroke="#5b6570" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="580" y="426" width="60" height="12" rx="2" fill="#f2efe9"/><text x="610.0" y="435" fill="#838b93" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RECORD PR</text><path d="M720,488 L500,488" fill="none" stroke="#5b6570" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/><rect x="578" y="470" width="64" height="12" rx="2" fill="#f2efe9"/><text x="610.0" y="479" fill="#838b93" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">OUTCOME PR</text><text x="732" y="184" fill="#838b93" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">every 2 min</text><text x="732" y="448" fill="#838b93" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">within minutes</text><text x="732
