<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f2efe9;--paper-2:#e8e3da;--ink:#1b1f24;--muted:#5b6570;--soft:#838b93;--accent:#b9791f;--link:#2e7ba6;--rule:rgba(27,31,36,0.12);
--card:#fff;--font-sans:'Geist',system-ui,sans-serif;--font-serif:'Instrument Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace}
body{font-family:var(--font-sans);background:var(--paper);color:var(--ink);padding:2.5rem 2rem 2rem}
.frame{max-width:1120px;margin:0 auto}
.eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:.5rem}
.lede{color:var(--muted);font-size:.9rem;line-height:1.5;max-width:70ch;margin-bottom:1.25rem}
.fig{overflow-x:auto}
svg{width:100%;min-width:900px;display:block}
.cards{display:grid;grid-template-columns:1.15fr 1fr 1.05fr;gap:.75rem;margin-top:1.25rem}
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:1rem 1.1rem}
.card .eyebrow{margin-bottom:.35rem}
.card p,.card li{font-size:.8rem;line-height:1.5;color:var(--ink)}
.card ul{padding-left:1rem}
.card .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:.4rem;background:var(--muted)}
.card .dot.accent{background:var(--accent)} .card .dot.link{background:var(--link)}
.foot{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.06em;color:var(--soft);border-top:1px solid var(--rule);margin-top:1.25rem;padding-top:.6rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.foot a{color:var(--link);text-decoration:none}
@media (max-width:900px){.cards{grid-template-columns:1fr}}
@media print{@page{size:landscape;margin:10mm}body{padding:0}.cards{margin-top:.75rem}}

<div class="frame">
<p class="eyebrow">Release records · 02 · Architecture</p>
<h1>Where a release's data lives</h1>
<p class="lede">Everything is in git or on GitHub, except the tracking records Glidepath keeps for 14 days.</p>
<div class="fig">
<svg viewBox="0 32 1000 644" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="02-where-it-lives-title 02-where-it-lives-desc">
<title id="02-where-it-lives-title">Where a release's data lives</title>
<desc id="02-where-it-lives-desc">Tower talks only to Backstage's backend. The backend commits the draft to the app repo and publishes GitHub Releases there; opens release record and outcome PRs and sets sign-off statuses in gitops-&lt;app&gt;; opens the release-mode PR in gitops-cluster-dev-tenants; reads outcomes from Glidepath's release-tracking ConfigMaps on the dev cluster; and announces releases through Backstage notifications.</desc>

text><text x="768.0" y="242.0" fill="#5b6570" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">release PRs · releases/&lt;app&gt;@&lt;tag&gt;.yaml</text><rect x="584" y="296" width="368" height="64" rx="6" fill="#f2efe9"/><rect x="584" y="296" width="368" height="64" rx="6" fill="rgba(27,31,36,0.05)" stroke="#5b6570" stroke-width="1"/><text x="768.0" y="326.0" fill="#1b1f24" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">gitops-cluster-dev-tenants</text><text x="768.0" y="342.0" fill="#5b6570" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">release-modes.yaml</text><rect x="584" y="464" width="368" height="64" rx="6" fill="#f2efe9"/><rect x="584" y="464" width="368" height="64" rx="6" fill="rgba(27,31,36,0.05)" stroke="#5b6570" stroke-width="1"/><text x="768.0" y="494.0" fill="#1b1f24" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Release tracking</text><text x="768.0" y="510.0" fill="#5b6570" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ConfigMaps in app-&lt;app&gt;-cicd, swept after 14 days</text><text x="24" y="604" fill="#5b6570" font-size="16" font-family="'Instrument Serif', serif" font-style="italic">Only the draft is a direct commit, and it builds nothing. Every other write is a PR, a status or a Release.</text><line x1="24" y1="632" x2="976" y2="632" stroke="rgba(27,31,36,0.12)" stroke-width="0.8"/><text x="24" y="652" fill="#5b6570" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="96" y="644" width="16" height="12" rx="3" fill="rgba(91,101,112,0.10)" stroke="#838b93" stroke-width="1"/><text x="120" y="653" fill="#5b6570" font-size="8" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">You</text><rec
