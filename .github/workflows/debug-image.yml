name: Debug image

# Builds, pushes and signs ghcr.io/<repository owner>/tower-debug, the Tower break-glass debug container (debug-image/README.md).
# Multi-arch: the fleet runs amd64 and arm64 clusters. Signed keylessly with cosign through GitHub's OIDC token, so the
# signature says "built by this workflow on main" (verify with the identity in the README).

on:
  push:
    branches: [main]
    paths: ["debug-image/**", ".github/workflows/debug-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ghcr.io wants a lower-case owner; the image lives under whoever owns this repo.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tower-debug" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: debug-image
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Summary
        run: |
          echo "### ${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin this digest in the backend and both clusters' policies (debug-image/README.md)." >> "$GITHUB_STEP_SUMMARY"
